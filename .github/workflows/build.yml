name: Compilar

on:
  pull_request:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  apk:
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar Gradle (quitar la ruta de Java de Windows)
        run: |
          sed -i '/org.gradle.java.home/d' android/gradle.properties
          chmod +x android/gradlew
      - name: Llave de firma (debug keystore de Jose)
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

            SHA1=$(keytool -list -v -keystore "$RUNNER_TEMP/debug.keystore" -alias androiddebugkey -storepass android | grep 'SHA1:' | sed 's/.*SHA1: //')
            echo "Huella SHA-1 de la llave de firma: \`$SHA1\`" >> "$GITHUB_STEP_SUMMARY"
            echo "SHA-1: $SHA1"
            echo "KEY_SHA1=$SHA1" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto DEBUG_KEYSTORE_BASE64: el APK queda firmado con otra llave y no se instala encima de la app actual."
          fi
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk BingoVinilo.apk
      - name: Comprobar que el APK quedó firmado con la llave de Jose
        if: env.KEY_SHA1 != ''
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          GOT=$("$APKSIGNER" verify --print-certs BingoVinilo.apk | grep 'SHA-1 digest' | head -1 | sed 's/.*: //' | tr 'a-f' 'A-F' | sed 's/../&:/g;s/:$//')
          echo "Firma del APK: $GOT"
          [ "$GOT" = "$KEY_SHA1" ] || { echo "::error::El APK no quedó firmado con la llave de Jose ($GOT != $KEY_SHA1)"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: BingoVinilo-apk
          path: BingoVinilo.apk
          retention-days: 1
      - name: Ver si esta versión ya tiene Release
        id: version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(node -p "require('./package.json').version")
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "La versión $ver ya tiene Release: no se publica otra (sube la versión en package.json para publicar)."
            echo "publicar=no" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=si" >> "$GITHUB_OUTPUT"
            awk -v v="$ver" '
              /^## / { if (on) exit; if ($2 == v) { on = 1; next } }
              on { print }
            ' CHANGELOG.md > notas.md
            [ -s notas.md ] || echo "Versión $ver. Ver CHANGELOG.md." > notas.md
          fi
      # Cada mezcla a main con una versión nueva crea la etiqueta v<versión> y publica el Release.
      - name: Publicar Release
        if: steps.version.outputs.publicar == 'si'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Bingo del Vinilo ${{ steps.version.outputs.tag }}
          body_path: notas.md
          files: BingoVinilo.apk
